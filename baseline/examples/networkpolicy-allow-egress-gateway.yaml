# SAF-07 / SAF-08: allow only DNS and traffic to the AI gateway (or egress proxy).
# The gateway, not the workload, is allowed to reach model-provider endpoints.
# Adjust namespace and pod labels to match your cluster. NetworkPolicy matches IPs and
# labels, not hostnames; hostname allowlists belong in the gateway or egress proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-ai-gateway
  namespace: ai-ticket-summarizer
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              app: ai-gateway
      ports:
        - protocol: TCP
          port: 8443
