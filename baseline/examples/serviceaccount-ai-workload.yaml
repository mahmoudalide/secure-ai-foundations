# SAF-01: one ServiceAccount per AI use case; no automatic API token unless needed.
# For cloud access, bind this ServiceAccount to a cloud role with your provider's
# workload identity mechanism instead of mounting static keys (see SAF-05).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uc-0001-summarizer
  namespace: ai-ticket-summarizer
  labels:
    saf.example/use-case-id: UC-0001
automountServiceAccountToken: false
